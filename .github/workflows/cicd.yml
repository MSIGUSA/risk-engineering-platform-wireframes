name: Build and Deploy UI to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    env:
      STATIC_WEB_APP_NAME: IS-E2-DEV-UWWB-SWEB-RiskEngineeringPlatformWireframes
      STATIC_WEB_APP_RESOURCE_GROUP: IS-E2-DEV-UWWB-RG

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.NONPROD_AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.NONPROD_AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.MSIGUSA_NONPROD_AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Get Static Web App deployment token
        id: swa_token
        run: |
          az extension add --name staticwebapp --upgrade
          API_TOKEN=$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$STATIC_WEB_APP_RESOURCE_GROUP" \
            --query "properties.apiKey" \
            --output tsv)
          echo "api_token=$API_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.api_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
